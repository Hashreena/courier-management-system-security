name: Multi-Tool Security Scan, Jira and Email

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-analysis:
    name: Multi-Tool Security Analysis
    runs-on: ubuntu-latest

    steps:
      # 1. Download the complete repository and Git history.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Install Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Semgrep and Jira HTTP dependency.
      - name: Install Python security dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep requests

      # 4. Install a pinned Gitleaks version.
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

          rm -f gitleaks.tar.gz gitleaks

      # 5. Display scanner versions.
      - name: Display security scanner versions
        run: |
          echo "Semgrep version:"
          semgrep --version

          echo ""
          echo "Gitleaks version:"
          gitleaks version

      # 6. Run Semgrep SAST.
      #
      # The scanner is allowed to return a finding-related exit code.
      # The quality gate is applied later, after Jira and email complete.
      - name: Run Semgrep SAST scan
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-report.json \
            .

      # 7. Ensure a usable Semgrep report always exists.
      - name: Ensure Semgrep report exists
        if: always()
        run: |
          if [ ! -f semgrep-report.json ]; then
            echo '{"results":[],"errors":[{"message":"Semgrep report was not generated"}]}' \
              > semgrep-report.json
          fi

      # 8. Run Gitleaks against Git history.
      #
      # --redact prevents discovered secret values from being placed
      # directly into the report.
      #
      # --exit-code 0 allows Jira, email and artifact steps to run.
      # The final quality gate fails the workflow later.
      - name: Run Gitleaks secret scan
        id: gitleaks
        continue-on-error: true
        run: |
          gitleaks git . \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 0

      # 9. Ensure a usable Gitleaks report always exists.
      - name: Ensure Gitleaks report exists
        if: always()
        run: |
          if [ ! -f gitleaks-report.json ]; then
            echo '[]' > gitleaks-report.json
          fi

      # 10. Combine scanner outputs, calculate risk and generate reports.
      - name: Analyse combined security findings
        id: analyse
        run: |
          python scripts/analyse_security_results.py

      # 11. Upload all generated reports to GitHub.
      - name: Upload multi-tool security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-tool-security-reports
          path: |
            semgrep-report.json
            gitleaks-report.json
            combined-security-report.json
            security-report.txt
            security-report.html
          if-no-files-found: warn
          retention-days: 30

      # 12. Create a Jira issue only when findings exist.
      - name: Create Jira security issue
        id: jira
        if: steps.analyse.outputs.has_findings == 'true'
        continue-on-error: true
        env:
          JIRA_BASE_URL: https://cms-software-security.atlassian.net
          JIRA_PROJECT_KEY: SCRUM
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python scripts/create_jira_issue.py

      # 13. Attach every important report to the created Jira issue.
      #
      # Jira requires X-Atlassian-Token: no-check for attachments.
      - name: Attach reports to Jira issue
        if: steps.jira.outputs.issue_key != ''
        continue-on-error: true
        env:
          JIRA_BASE_URL: https://cms-software-security.atlassian.net
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          for REPORT_FILE in \
            combined-security-report.json \
            security-report.txt \
            security-report.html \
            semgrep-report.json \
            gitleaks-report.json
          do
            if [ -f "${REPORT_FILE}" ]; then
              echo "Attaching ${REPORT_FILE} to ${JIRA_ISSUE_KEY}"

              curl \
                --fail-with-body \
                --request POST \
                --url "${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_ISSUE_KEY}/attachments" \
                --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
                --header "X-Atlassian-Token: no-check" \
                --header "Accept: application/json" \
                --form "file=@${REPORT_FILE}"
            fi
          done

      # 14. Send an email for both clean and vulnerable scans.
      #
      # For a vulnerable scan, the message contains the Jira issue.
      # For a clean scan, it states that no Jira issue was required.
      - name: Send security notification email
        if: always() && steps.analyse.outcome == 'success'
        continue-on-error: true
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          JIRA_ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
          JIRA_ISSUE_URL: ${{ steps.jira.outputs.issue_url }}
        run: |
          python scripts/send_email_notification.py

      # 15. Add integration details to the GitHub Actions summary.
      - name: Add integration result to GitHub summary
        if: always() && steps.analyse.outcome == 'success'
        run: |
          {
            echo ""
            echo "## Automated Integrations"
            echo ""
            echo "| Integration | Result |"
            echo "|---|---|"

            if [ -n "${{ steps.jira.outputs.issue_key }}" ]; then
              echo "| Jira | [${{ steps.jira.outputs.issue_key }}](${{ steps.jira.outputs.issue_url }}) |"
            elif [ "${{ steps.analyse.outputs.has_findings }}" = "false" ]; then
              echo "| Jira | No issue required because no findings were detected |"
            else
              echo "| Jira | Issue creation was unsuccessful or skipped |"
            fi

            echo "| Email | Notification step executed |"
            echo "| Report artifact | multi-tool-security-reports |"
          } >> "${GITHUB_STEP_SUMMARY}"

      # 16. Apply the final security quality gate.
      #
      # This is deliberately the final step so reports, Jira and email
      # are completed before the workflow is marked as failed.
      - name: Enforce security quality gate
        if: steps.analyse.outputs.should_fail == 'true'
        run: |
          echo "Security quality gate failed."
          echo ""
          echo "Critical, High, or exposed-secret findings exist."
          echo "Review the reports and Jira issue before merging."
          exit 1

      # 17. Show a successful final result when no serious findings exist.
      - name: Confirm security quality gate passed
        if: steps.analyse.outputs.should_fail == 'false'
        run: |
          echo "Security quality gate passed."
          echo "No Critical or High security findings were detected."
