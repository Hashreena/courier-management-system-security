name: Multi-Tool Security Scan, Jira and Email

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-analysis:
    name: Multi-Tool Security Analysis
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # 3. Install Python dependencies
      # ------------------------------------------------------------
      - name: Install Python security dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep requests

      # ------------------------------------------------------------
      # 4. Install Gitleaks
      # ------------------------------------------------------------
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks

          sudo install gitleaks /usr/local/bin/gitleaks

          rm -f gitleaks.tar.gz
          rm -f gitleaks

      # ------------------------------------------------------------
      # 5. Display scanner versions
      # ------------------------------------------------------------
      - name: Display security scanner versions
        run: |
          echo "Semgrep version:"
          semgrep --version

          echo ""

          echo "Gitleaks version:"
          gitleaks version

      # ------------------------------------------------------------
      # 6. Run Semgrep SAST
      # ------------------------------------------------------------
      - name: Run Semgrep SAST scan
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config auto \
            --json \
            --output semgrep-report.json \
            .

      # ------------------------------------------------------------
      # 7. Ensure Semgrep report exists
      # ------------------------------------------------------------
      - name: Ensure Semgrep report exists
        if: always()
        run: |
          if [ ! -f semgrep-report.json ]; then
            echo '{
              "results": [],
              "errors": [
                {
                  "message": "Semgrep report was not generated"
                }
              ]
            }' > semgrep-report.json
          fi

          echo "Semgrep report information:"
          ls -lh semgrep-report.json

      # ------------------------------------------------------------
      # 8. Run Gitleaks secret scanning
      # ------------------------------------------------------------
      - name: Run Gitleaks secret scan
        id: gitleaks
        continue-on-error: true
        run: |
          gitleaks git . \
            --report-format json \
            --report-path gitleaks-report.json \
            --redact \
            --exit-code 0

      # ------------------------------------------------------------
      # 9. Ensure Gitleaks report exists
      # ------------------------------------------------------------
      - name: Ensure Gitleaks report exists
        if: always()
        run: |
          if [ ! -f gitleaks-report.json ]; then
            echo '[]' > gitleaks-report.json
          fi

          echo "Gitleaks report information:"
          ls -lh gitleaks-report.json

      # ------------------------------------------------------------
      # 10. Analyse findings and generate reports
      # ------------------------------------------------------------
      - name: Analyse combined security findings
        id: analyse
        if: always()
        run: |
          python scripts/analyse_security_results.py

      # ------------------------------------------------------------
      # 11. Verify generated report files
      # ------------------------------------------------------------
      - name: Verify generated security reports
        if: always()
        run: |
          echo "Checking generated report files..."

          REPORT_FILES=(
            "semgrep-report.json"
            "gitleaks-report.json"
            "combined-security-report.json"
            "security-report.txt"
            "security-report.html"
          )

          for REPORT_FILE in "${REPORT_FILES[@]}"
          do
            if [ -f "${REPORT_FILE}" ]; then
              echo "Found: ${REPORT_FILE}"
              ls -lh "${REPORT_FILE}"
            else
              echo "Missing: ${REPORT_FILE}"
            fi
          done

      # ------------------------------------------------------------
      # 12. Upload reports as GitHub Actions artifact
      # ------------------------------------------------------------
      - name: Upload multi-tool security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-tool-security-reports-${{ github.run_number }}
          path: |
            semgrep-report.json
            gitleaks-report.json
            combined-security-report.json
            security-report.txt
            security-report.html
          if-no-files-found: error
          retention-days: 30

      # ------------------------------------------------------------
      # 13. Create Jira issue when findings exist
      # ------------------------------------------------------------
      - name: Create Jira security issue
        id: jira
        if: |
          always() &&
          steps.analyse.outcome == 'success' &&
          steps.analyse.outputs.has_findings == 'true'
        continue-on-error: true
        env:
          JIRA_BASE_URL: https://cms-software-security.atlassian.net
          JIRA_PROJECT_KEY: SCRUM
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          python scripts/create_jira_issue.py

      # ------------------------------------------------------------
      # 14. Attach reports to Jira
      # ------------------------------------------------------------
      - name: Attach security reports to Jira
        if: |
          always() &&
          steps.jira.outputs.issue_key != ''
        continue-on-error: true
        env:
          JIRA_BASE_URL: https://cms-software-security.atlassian.net
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
        run: |
          REPORT_FILES=(
            "combined-security-report.json"
            "security-report.txt"
            "security-report.html"
            "semgrep-report.json"
            "gitleaks-report.json"
          )

          for REPORT_FILE in "${REPORT_FILES[@]}"
          do
            if [ -f "${REPORT_FILE}" ]; then
              echo "Attaching ${REPORT_FILE} to ${JIRA_ISSUE_KEY}"

              curl \
                --fail-with-body \
                --request POST \
                --url "${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_ISSUE_KEY}/attachments" \
                --user "${JIRA_EMAIL}:${JIRA_API_TOKEN}" \
                --header "X-Atlassian-Token: no-check" \
                --header "Accept: application/json" \
                --form "file=@${REPORT_FILE}"
            else
              echo "Report file not found: ${REPORT_FILE}"
            fi
          done

      # ------------------------------------------------------------
      # 15. Send email notification
      # ------------------------------------------------------------
      - name: Send security notification email
        if: |
          always() &&
          steps.analyse.outcome == 'success'
        continue-on-error: true
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

          JIRA_ISSUE_KEY: ${{ steps.jira.outputs.issue_key }}
          JIRA_ISSUE_URL: ${{ steps.jira.outputs.issue_url }}
        run: |
          python scripts/send_email_notification.py

      # ------------------------------------------------------------
      # 16. Add integration status to GitHub Summary
      # ------------------------------------------------------------
      - name: Add integration results to GitHub summary
        if: always()
        run: |
          {
            echo ""
            echo "## Automated Integrations"
            echo ""
            echo "| Integration | Result |"
            echo "|---|---|"

            if [ -n "${{ steps.jira.outputs.issue_key }}" ]; then
              echo "| Jira | [${{ steps.jira.outputs.issue_key }}](${{ steps.jira.outputs.issue_url }}) |"
            elif [ "${{ steps.analyse.outputs.has_findings }}" = "false" ]; then
              echo "| Jira | No issue required because no findings were detected |"
            else
              echo "| Jira | Issue creation was skipped or unsuccessful |"
            fi

            echo "| Email | Notification step executed |"
            echo "| Artifact | multi-tool-security-reports-${{ github.run_number }} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      # ------------------------------------------------------------
      # 17. Report quality gate result without failing workflow
      # ------------------------------------------------------------
      - name: Report security quality gate result
        if: always()
        run: |
          if [ "${{ steps.analyse.outputs.should_fail }}" = "true" ]; then
            echo "Security findings require review."
            echo ""
            echo "Critical, High, or exposed-secret findings were detected."
            echo "The workflow remains successful for reporting purposes."

            {
              echo ""
              echo "## Security Quality Gate"
              echo ""
              echo "### ⚠️ REVIEW REQUIRED"
              echo ""
              echo "Critical, High, or exposed-secret findings were detected."
              echo ""
              echo "Review the generated reports and Jira issue before merging."
              echo ""
              echo "The workflow is shown as successful because the quality gate is currently operating in reporting mode."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Security quality gate passed."
            echo ""
            echo "No Critical, High, or exposed-secret findings were detected."

            {
              echo ""
              echo "## Security Quality Gate"
              echo ""
              echo "### ✅ PASSED"
              echo ""
              echo "No Critical, High, or exposed-secret findings were detected."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      # ------------------------------------------------------------
      # 18. Confirm workflow completion
      # ------------------------------------------------------------
      - name: Confirm security workflow completed
        if: always()
        run: |
          echo "Multi-tool security workflow completed."
          echo ""
          echo "Semgrep findings: ${{ steps.analyse.outputs.semgrep_total }}"
          echo "Gitleaks findings: ${{ steps.analyse.outputs.gitleaks_total }}"
          echo "Critical: ${{ steps.analyse.outputs.critical }}"
          echo "High: ${{ steps.analyse.outputs.high }}"
          echo "Medium: ${{ steps.analyse.outputs.medium }}"
          echo "Low: ${{ steps.analyse.outputs.low }}"
          echo "Total findings: ${{ steps.analyse.outputs.total }}"
          echo "Risk score: ${{ steps.analyse.outputs.risk_score }}/100"
          echo "Risk level: ${{ steps.analyse.outputs.risk_level }}"
          echo ""
          echo "The GitHub Actions run remains successful."
